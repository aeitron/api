# ==============================================================================
# Aeitron API Gateway — Development Docker Compose Stack
# FOR LOCAL DEVELOPMENT AND TESTING ONLY.
# Do NOT use this file in production environments.
# For production deployments with network isolation, secret validation,
# and non-root execution, use: docker compose -f docker-compose.prod.yml up -d
# ==============================================================================

version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: aeitron/api:latest
    container_name: aeitron-api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - AEITRON_ENV=development
      - AEITRON_DEV_MODE=true
      - AEITRON_JWT_SECRET=aeitron-dev-insecure-secret-key-32bytes-min
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: aeitron-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

