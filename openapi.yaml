openapi: 3.1.0
info:
  title: Aeitron Intelligent Global Edge & Cloud Infrastructure API
  description: |
    Unified, high-performance developer API for the Aeitron Cloud Platform.
    Provides complete programmatic control over Edge Routing, Anycast DNS,
    Sovereign Databases, Compute/VPS/GPU, Web Hosting, Domain Registration,
    Server-Authoritative Pricing, Real-time Metering, and Merkle Audit Ledgers.
  version: 1.0.0
  contact:
    name: Aeitron Developer Support
    url: https://aeitron.com
    email: api-support@aeitron.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.aeitron.com
    description: Production Global Anycast Gateway
  - url: http://127.0.0.1:8000
    description: Local Unified API Gateway

security:
  - ApiKeyAuth: []
  - BearerAuth: []

paths:
  /ready:
    get:
      summary: Gateway Readiness Check
      description: Returns 200 OK when the gateway and upstream proxies are operational.
      security: []
      responses:
        '200':
          description: Gateway is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: aeitron-api-gateway
                  time:
                    type: string
                    format: date-time

  /live:
    get:
      summary: Gateway Liveness Check
      description: Returns 200 OK when the gateway process is running.
      security: []
      responses:
        '200':
          description: Process is alive

  /metrics:
    get:
      summary: Prometheus Operational Metrics
      description: |
        Exports live gateway operational metrics in standard OpenMetrics Prometheus text format (version 0.0.4).
        Directly scrapable by Prometheus, VictoriaMetrics, and Grafana.
        Includes request throughput (RPS), p50/p95/p99 latency histograms, in-flight requests,
        RFC 9111 cache operations, rate limit drops, and upstream circuit breaker trip states.
      security: []
      responses:
        '200':
          description: Standard OpenMetrics Prometheus exposition text
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP aeitron_api_requests_total Total number of HTTP requests processed by the API gateway
                  # TYPE aeitron_api_requests_total counter
                  aeitron_api_requests_total{method="GET",route="/v1/catalog",status="200"} 42

  /v1/gateway/stats:
    get:
      summary: Retrieve Real-Time Gateway Statistics
      description: Returns live telemetry, uptime, rate limited counts, and status code distributions.
      responses:
        '200':
          description: Gateway statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayStats'

  /v1/gateway/routes:
    get:
      summary: List Registered Routing Rules
      description: Returns the active reverse proxy table, timeout configurations, and upstream endpoints.
      responses:
        '200':
          description: Active route table
          content:
            application/json:
              schema:
                type: object
                properties:
                  routes:
                    type: array
                    items:
                      $ref: '#/components/schemas/RouteRule'

  /v1/gateway/upstreams:
    get:
      summary: Upstream Pools & Active Health Check Telemetry
      description: |
        Returns the real-time operational status of all load-balanced upstream pools,
        including configured algorithms (round_robin, least_conn), individual node health,
        active in-flight connection counts, latencies, and circuit breaker states.
      responses:
        '200':
          description: Live upstream pool status and node health
          content:
            application/json:
              schema:
                type: object
                properties:
                  upstreams:
                    type: object

  /v1/gateway/cluster:
    get:
      summary: Distributed Cluster State Adapter Telemetry
      description: |
        Returns the real-time operational status of the distributed state synchronization adapter
        (memory or redis/KeyDB), ping latency, cluster mode, and distributed error counts.
      responses:
        '200':
          description: Live cluster state adapter operational status
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                    example: redis
                  status:
                    type: string
                    example: connected
                  ping_latency_micros:
                    type: integer
                    example: 120
                  cluster_errors:
                    type: integer
                    example: 0
                  redis_addr:
                    type: string
                    example: 127.0.0.1:6379

  /v1/gateway/traces:
    get:
      summary: List Recent Distributed Traces
      description: |
        Returns recent W3C distributed traces recorded in the in-memory circular ring buffer.
        Supports filtering by minimum latency duration (e.g. min_duration_ms=50 for slow trace identification), status code, and result limit.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 500
        - name: min_duration_ms
          in: query
          description: Filter traces exceeding this duration in milliseconds
          schema:
            type: integer
            example: 50
        - name: status
          in: query
          description: Filter traces by HTTP response status code
          schema:
            type: integer
            example: 500
      responses:
        '200':
          description: List of matching distributed traces with lifecycle metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  traces:
                    type: array
                    items:
                      $ref: '#/components/schemas/TraceContext'
                  stats:
                    $ref: '#/components/schemas/TracingStats'

  /v1/gateway/traces/slow:
    get:
      summary: List Latency-Degraded Traces (>50ms)
      description: |
        Rapidly isolates slow requests exceeding the gateway latency budget (default >50ms).
        Enables instant root-cause analysis across gateway ingress, auth, cache, and upstream stages.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Latency-degraded traces
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  slow_threshold_ms:
                    type: integer
                  total_slow_detected:
                    type: integer
                  slow_traces:
                    type: array
                    items:
                      $ref: '#/components/schemas/TraceContext'

  /v1/gateway/traces/stats:
    get:
      summary: Distributed Tracing Ring Buffer Stats
      description: Returns buffer utilization, captured trace count, capacity, and active sampling rate.
      responses:
        '200':
          description: Tracing engine operational metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TracingStats'

  /v1/gateway/traces/config:
    post:
      summary: Dynamic Tracing Configuration
      description: Dynamically tunes trace sampling probability (0.0 to 1.0) and slow threshold without restarts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sampling_rate:
                  type: number
                  minimum: 0.0
                  maximum: 1.0
                  example: 0.5
                slow_threshold_ms:
                  type: integer
                  minimum: 1
                  example: 50
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  stats:
                    $ref: '#/components/schemas/TracingStats'

  /v1/gateway/traces/{trace_id}:
    get:
      summary: Detailed Trace with Full Span Hierarchy
      description: Retrieves complete microsecond span timeline for a trace (Ingress -> RateLimit -> Auth -> Cache -> Upstream -> Egress).
      parameters:
        - name: trace_id
          in: path
          required: true
          schema:
            type: string
            example: 4bf92f3577b34da6a3ce929d0e0e4736
      responses:
        '200':
          description: Trace detail with all spans, microsecond timings, attributes, and events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceContext'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /v1/gateway/traces/{trace_id}/export:
    get:
      summary: Export Trace to OpenTelemetry, Jaeger, or Zipkin
      description: |
        Exports trace data in standard OpenTelemetry (OTLP v1 JSON), Jaeger UI/Ingestion JSON, or Zipkin v2 format.
        Directly consumable by Jaeger collector, Zipkin server, Datadog Agent, or OpenTelemetry Collector.
      parameters:
        - name: trace_id
          in: path
          required: true
          schema:
            type: string
            example: 4bf92f3577b34da6a3ce929d0e0e4736
        - name: format
          in: query
          schema:
            type: string
            enum: [otlp, jaeger, zipkin]
            default: otlp
      responses:
        '200':
          description: Exported trace representation in requested standard format
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/NotFoundError'

  /v1/auth/token:
    post:
      summary: Fast API-Key Token Exchange or JWT Issuance
      description: Authenticates credentials or exchanges an API key for a signed HMAC-SHA256 JWT access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key:
                  type: string
                  example: aeitron_live_secret_key_...
                client_id:
                  type: string
                client_secret:
                  type: string
      responses:
        '200':
          description: Token issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /v1/sandbox/state:
    get:
      summary: Inspect Sandboxed Test Infrastructure State
      description: Returns all mock orders, microVMs, DNS zones, and buckets created within the tenant's isolated sandbox.
      responses:
        '200':
          description: Active sandbox fixtures
          content:
            application/json:
              schema:
                type: object
                properties:
                  livemode:
                    type: boolean
                    example: false
                  tenant_id:
                    type: string
                  state:
                    type: object

  /v1/sandbox/reset:
    post:
      summary: Reset Sandboxed Environment
      description: Clears all mock infrastructure fixtures, test orders, and simulated resources for the tenant.
      responses:
        '200':
          description: Sandbox successfully reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: sandbox_reset_success
                  livemode:
                    type: boolean
                    example: false

  /v1/sandbox/config:
    get:
      summary: Get Sandbox Simulation Configuration
      description: Returns test card numbers, simulated boot latency, and mock IP subnets for development testing.
      responses:
        '200':
          description: Sandbox mock environment configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  livemode:
                    type: boolean
                    example: false
                  test_card_numbers:
                    type: array
                    items:
                      type: string
                  test_network_range:
                    type: string
                    example: 198.51.100.0/24 (RFC 5737 Test-Net)

  /v1/webhooks/subscriptions:
    post:
      summary: Register Webhook Subscription
      description: |
        Registers an asynchronous webhook destination endpoint with Stripe-style HMAC-SHA256 signature verification.
        Validates target URLs against Server-Side Request Forgery (SSRF) attacks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  example: https://app.example.com/api/webhooks/aeitron
                events:
                  type: array
                  items:
                    type: string
                  example: ["deployment.*", "invoice.paid", "ddos.detected"]
                secret:
                  type: string
                  description: Optional custom signing secret (auto-generated if omitted)
                  example: whsec_9a8b7c6d5e4f3a2b1c0d
                active:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Webhook subscription successfully registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription:
                    $ref: '#/components/schemas/WebhookSubscription'
        '400':
          $ref: '#/components/responses/BadRequestError'

    get:
      summary: List Webhook Subscriptions
      description: Returns all active and inactive webhook subscriptions for the authenticated tenant.
      responses:
        '200':
          description: List of registered webhook subscriptions
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookSubscription'
                  count:
                    type: integer

  /v1/webhooks/subscriptions/{id}:
    get:
      summary: Retrieve Webhook Subscription
      description: Returns subscription metadata, configured events, and signing secret.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: sub_a1b2c3d4e5f6
      responses:
        '200':
          description: Subscription details
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription:
                    $ref: '#/components/schemas/WebhookSubscription'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      summary: Delete Webhook Subscription
      description: Permanently deactivates and removes a webhook subscription.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: sub_a1b2c3d4e5f6
      responses:
        '200':
          description: Subscription deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
                  id:
                    type: string
                    example: sub_a1b2c3d4e5f6
        '404':
          $ref: '#/components/responses/NotFoundError'

  /v1/webhooks/dispatch:
    post:
      summary: Dispatch Asynchronous Cloud Event
      description: |
        Matches an event type against registered tenant subscriptions and enqueues
        asynchronous webhook deliveries with HMAC-SHA256 signatures and exponential backoff retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                id:
                  type: string
                  example: evt_123456789abc
                type:
                  type: string
                  example: deployment.succeeded
                tenant_id:
                  type: string
                data:
                  type: object
                  example:
                    deployment_id: dep_xyz
                    environment: production
      responses:
        '202':
          description: Cloud event dispatched to subscriber delivery queues
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: dispatched
                  event_id:
                    type: string
                  event_type:
                    type: string
                  count:
                    type: integer
                  deliveries:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookDelivery'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /v1/webhooks/deliveries:
    get:
      summary: List Recent Webhook Deliveries
      description: Returns recent webhook delivery attempts, status codes, latencies, and retry statuses.
      responses:
        '200':
          description: List of webhook deliveries
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveries:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookDelivery'
                  count:
                    type: integer

  /v1/webhooks/dead-letter:
    get:
      summary: List Dead-Letter Queue (DLQ) Items
      description: Returns deliveries that permanently failed all exponential backoff retry attempts.
      responses:
        '200':
          description: Failed deliveries in Dead-Letter Queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  dead_letters:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeadLetterItem'
                  count:
                    type: integer

  /v1/webhooks/dead-letter/retry:
    post:
      summary: Manually Redeliver Failed Webhook from DLQ
      description: Resets attempt count and immediately re-enqueues a dead-letter item for delivery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delivery_id]
              properties:
                delivery_id:
                  type: string
                  example: del_9a8b7c6d5e4f
      responses:
        '200':
          description: Redelivery successfully scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: redelivery_scheduled
                  delivery:
                    $ref: '#/components/schemas/WebhookDelivery'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /v1/webhooks/test:
    post:
      summary: Simulate Live Webhook Dispatch
      description: |
        Dispatches a test event synchronously to an arbitrary destination URL with
        live HMAC-SHA256 signature generation and returns the complete delivery diagnostic details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestWebhookRequest'
      responses:
        '200':
          description: Webhook simulation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestDeliveryResult'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /v1/webhooks/portal:
    get:
      summary: Interactive Webhooks Developer Portal HUD
      description: |
        Serves the embedded reactive Webhooks HUD interface with interactive simulation tester,
        real-time deliveries stream, dead-letter queue management, and code snippets.
      security: []
      responses:
        '200':
          description: Webhooks Developer Portal HTML interface
          content:
            text/html:
              schema:
                type: string

  /v1/events/stream:
    get:
      summary: Real-Time Infrastructure Events Stream (Server-Sent Events)
      description: |
        Streams real-time infrastructure lifecycle events over standard W3C Server-Sent Events (SSE).
        Supports topic filtering (`?topics=compute.instances,dns.health`), event types (`?events=...`),
        and transparent historical replay via `Last-Event-ID`.
      parameters:
        - name: topics
          in: query
          description: Comma-separated list of topics or wildcards (e.g. `compute.*,dns.health`)
          required: false
          schema:
            type: string
            example: compute.instances,dns.health
        - name: events
          in: query
          description: Comma-separated list of specific event types
          required: false
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          description: ID of the last successfully received event for automatic replay
          required: false
          schema:
            type: string
      responses:
        '200':
          description: W3C Server-Sent Events continuous text stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  id: evt_123456
                  event: compute.instances
                  data: {"instance_id": "vm-99824", "status": "running"}

  /v1/events/publish:
    post:
      summary: Publish Infrastructure Lifecycle Event
      description: |
        Broadcasts an infrastructure event to all active real-time SSE subscribers and
        records it in the circular ring buffer for reconnection replay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InfrastructureEvent'
      responses:
        '202':
          description: Event successfully accepted for broadcast
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: published
                  event_id:
                    type: string
                  topic:
                    type: string
                  type:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequestError'

  /v1/events/history:
    get:
      summary: Query Recent Event Ring Buffer History
      description: Retrieves recent infrastructure events from the high-performance memory ring buffer.
      parameters:
        - name: topic
          in: query
          description: Optional topic filter or wildcard pattern
          required: false
          schema:
            type: string
            example: compute.instances
        - name: limit
          in: query
          description: Maximum number of events to return (max 500)
          required: false
          schema:
            type: integer
            default: 50
            example: 20
      responses:
        '200':
          description: Historical events list
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/InfrastructureEvent'
                  count:
                    type: integer

  /v1/catalog:
    get:
      summary: List Product Catalog & Base Pricing
      description: Returns all active platform products (Compute, Domains, Hosting, Storage, Databases) with server-authoritative rates.
      security: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [domain, hosting, vps, database, storage]
      responses:
        '200':
          description: Product catalog listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'

  /v1/catalog/calculate:
    post:
      summary: Calculate Server-Authoritative Quote
      description: Computes exact monetary quote with tax and volume discounts. Client prices are never trusted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [priceId, quantity]
                    properties:
                      priceId:
                        type: string
                      quantity:
                        type: integer
                        minimum: 1
                currency:
                  type: string
                  enum: [USD, BDT]
                  default: USD
                discountCode:
                  type: string
      responses:
        '200':
          description: Calculated quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteCalculation'

  /v1/orders:
    post:
      summary: Create Order (Server-Authoritative Checkout)
      description: Places an order against server-verified prices. Triggers transactional outbox provisioning workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [priceId, quantity]
                    properties:
                      priceId:
                        type: string
                      quantity:
                        type: integer
                currency:
                  type: string
                  enum: [USD, BDT]
                idempotencyKey:
                  type: string
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /v1/orders/{order_id}:
    get:
      summary: Get Order Status and Provisioning Lifecycle
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /v1/invoices:
    get:
      summary: List Invoices & Tax Receipts
      description: Retrieves tenant invoices with Mushak 6.3 VAT compliance details.
      responses:
        '200':
          description: List of invoices

  /v1/domains/search:
    get:
      summary: Multi-TLD Domain Search & Suggestions
      description: Queries RDAP and registrar cache for multi-TLD availability and smart suggestions.
      security: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: tlds
          in: query
          schema:
            type: string
            example: com,net,org,com.bd
      responses:
        '200':
          description: Search results

  /v1/domains/check:
    get:
      summary: Authoritative Domain Availability Check
      description: Checks syntax, authoritative registrar availability, and real-time premium pricing.
      security: []
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
        - name: currency
          in: query
          schema:
            type: string
            enum: [USD, BDT]
      responses:
        '200':
          description: Domain availability result

  /v1/domains/register:
    post:
      summary: Register a Domain
      description: Purchases and registers a domain via authoritative registrar adapter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, years]
              properties:
                domain:
                  type: string
                years:
                  type: integer
                  minimum: 1
                  maximum: 10
      responses:
        '202':
          description: Domain registration initiated

  /v1/dns/zones:
    get:
      summary: List Authoritative DNS Zones
      responses:
        '200':
          description: List of DNS zones
    post:
      summary: Create DNS Zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
      responses:
        '201':
          description: Zone created

  /v1/dns/zones/{zone_id}/records:
    get:
      summary: List DNS Records in Zone
      parameters:
        - name: zone_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: DNS records
    post:
      summary: Create or Update DNS Record
      parameters:
        - name: zone_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, name, content, ttl]
              properties:
                type:
                  type: string
                  enum: [A, AAAA, CNAME, MX, TXT, NS, SRV, CAA]
                name:
                  type: string
                content:
                  type: string
                ttl:
                  type: integer
                  default: 300
      responses:
        '201':
          description: DNS record published

  /v1/hosting/accounts:
    get:
      summary: List Web Hosting Accounts
      responses:
        '200':
          description: Hosting accounts
    post:
      summary: Provision Web Hosting Account
      description: Sets up shared hosting, WordPress, or WooCommerce with cPanel/CyberPanel isolation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, plan]
              properties:
                domain:
                  type: string
                plan:
                  type: string
                  enum: [shared-starter, managed-wordpress, woocommerce-scale]
      responses:
        '201':
          description: Hosting account provisioned

  /v1/compute/instances:
    get:
      summary: List VPS and GPU Compute Instances
      responses:
        '200':
          description: List of compute instances
    post:
      summary: Provision VPS or GPU Compute Instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, plan, region, os_image]
              properties:
                name:
                  type: string
                plan:
                  type: string
                region:
                  type: string
                os_image:
                  type: string
                ssh_key:
                  type: string
      responses:
        '202':
          description: Instance provisioning queued

  /v1/compute/instances/{instance_id}/reboot:
    post:
      summary: Soft/Hard Reboot Compute Instance
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Reboot signal sent

  /v1/compute/instances/{instance_id}:
    delete:
      summary: Terminate Compute Instance
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Termination initiated

  /v1/databases/instances:
    get:
      summary: List Managed Database Instances
      responses:
        '200':
          description: List of database instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatabaseInstance'
    post:
      summary: Provision a New Sovereign Database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatabaseRequest'
      responses:
        '201':
          description: Database instance provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseInstance'

  /v1/databases/instances/{instance_id}/pitr/restore:
    post:
      summary: Point-In-Time Recovery (PITR) Restore
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_timestamp]
              properties:
                target_timestamp:
                  type: string
                  format: date-time
      responses:
        '202':
          description: PITR recovery started

  /v1/usage/events:
    post:
      summary: Ingest Real-Time Telemetry Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  items:
                    type: object
                    required: [event_id, tenant_id, metric, value]
                    properties:
                      event_id:
                        type: string
                      tenant_id:
                        type: string
                      metric:
                        type: string
                      value:
                        type: number
      responses:
        '202':
          description: Telemetry events accepted for sliding window aggregation

  /v1/usage/tenant/{tenant_id}/current:
    get:
      summary: Get Real-Time Tenant Usage Snapshot
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Real-time tenant usage snapshot

  /v1/notifications/dispatch:
    post:
      summary: Broadcast System or User Event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, type, severity, title, message]
              properties:
                tenant_id:
                  type: string
                type:
                  type: string
                severity:
                  type: string
                  enum: [info, warning, error, critical]
                title:
                  type: string
                message:
                  type: string
      responses:
        '202':
          description: Notification event accepted

  /v1/notifications/subscriptions:
    post:
      summary: Create Alert Channel Subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, channel, target]
              properties:
                tenant_id:
                  type: string
                channel:
                  type: string
                  enum: [webhook, email, sms, slack, discord, pagerduty]
                target:
                  type: string
                secret:
                  type: string
      responses:
        '201':
          description: Subscription created

  /v1/notifications/dlq:
    get:
      summary: List Dead-Letter Queue (DLQ) Records
      responses:
        '200':
          description: Dead-letter queue records

  /v1/fleet/nodes:
    get:
      summary: List Global Edge Nodes
      responses:
        '200':
          description: Edge node inventory

  /v1/fleet/canary/deploy:
    post:
      summary: Trigger Canary Deployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, initial_percentage]
              properties:
                version:
                  type: string
                initial_percentage:
                  type: integer
      responses:
        '202':
          description: Canary rollout initiated

  /v1/audit/records:
    get:
      summary: Query Merkle Cryptographic Audit Ledger
      responses:
        '200':
          description: Audit ledger records

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Scoped API Key (e.g. aeitron_live_... or aeitron_test_...)
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
        tenant_id:
          type: string
        tier:
          type: string

    GatewayStats:
      type: object
      properties:
        total_requests:
          type: integer
        active_connections:
          type: integer
        rate_limited_count:
          type: integer
        auth_failed_count:
          type: integer
        uptime_seconds:
          type: integer

    RouteRule:
      type: object
      properties:
        path_prefix:
          type: string
        upstream_url:
          type: string
        rewrite_prefix:
          type: string
        allow_anonymous:
          type: boolean
        timeout:
          type: integer

    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        prices:
          type: array
          items:
            type: object

    QuoteCalculation:
      type: object
      properties:
        subtotalMinorUnits:
          type: integer
        taxMinorUnits:
          type: integer
        totalMinorUnits:
          type: integer
        currency:
          type: string

    Order:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
        totalMinorUnits:
          type: integer
        currency:
          type: string

    DatabaseInstance:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        engine:
          type: string
        region:
          type: string
        status:
          type: string
        pitr_enabled:
          type: boolean

    CreateDatabaseRequest:
      type: object
      required: [name, engine, region]
      properties:
        name:
          type: string
        engine:
          type: string
          enum: [postgresql-16, timescaledb]
        region:
          type: string
        storage_gb:
          type: integer
          default: 20

    ProblemDetails:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        code:
          type: string
        error:
          type: string

    WebhookSubscription:
      type: object
      properties:
        id:
          type: string
          example: sub_123456789abc
        tenant_id:
          type: string
          example: tenant_corp
        url:
          type: string
          example: https://app.example.com/webhooks
        events:
          type: array
          items:
            type: string
          example: ["deployment.*", "invoice.paid"]
        secret:
          type: string
          example: whsec_0123456789abcdef0123456789abcdef
        active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          example: del_123456789abc
        subscription_id:
          type: string
          example: sub_123456789abc
        tenant_id:
          type: string
          example: tenant_corp
        event_id:
          type: string
          example: evt_123456789abc
        event_type:
          type: string
          example: deployment.succeeded
        url:
          type: string
          example: https://app.example.com/webhooks
        attempt:
          type: integer
          example: 1
        max_attempts:
          type: integer
          example: 3
        status_code:
          type: integer
          example: 200
        status:
          type: string
          enum: [pending, success, retrying, dead_letter]
          example: success
        duration_ms:
          type: integer
          example: 45
        created_at:
          type: string
          format: date-time

    DeadLetterItem:
      type: object
      properties:
        delivery:
          $ref: '#/components/schemas/WebhookDelivery'
        event:
          type: object
        subscription:
          $ref: '#/components/schemas/WebhookSubscription'
        failed_at:
          type: string
          format: date-time
        reason:
          type: string
          example: HTTP 500

    TestWebhookRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          example: https://app.example.com/api/webhooks/test
        secret:
          type: string
          example: whsec_test_secret_key
        event_type:
          type: string
          example: compute.instance.created
        data:
          type: object
          example:
            instance_id: vm-99824
            status: running

    TestDeliveryResult:
      type: object
      properties:
        url:
          type: string
        event_type:
          type: string
        status_code:
          type: integer
        success:
          type: boolean
        duration_ms:
          type: integer
        request_body:
          type: string
        response_body:
          type: string
        signature:
          type: string
        timestamp:
          type: string
        headers_sent:
          type: object
          additionalProperties:
            type: string
        error:
          type: string

    InfrastructureEvent:
      type: object
      required: [topic, type]
      properties:
        id:
          type: string
          example: evt_1730100000_a1b2c3
        topic:
          type: string
          example: compute.instances
        type:
          type: string
          example: instance.provisioned
        tenant_id:
          type: string
          example: tenant_corp
        timestamp:
          type: string
          format: date-time
        data:
          type: object
          example:
            instance_id: vm-99824
            region: us-east-1

    TraceContext:
      type: object
      properties:
        trace_id:
          type: string
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        span_id:
          type: string
          example: 00f067aa0ba902b7
        parent_span_id:
          type: string
        trace_flags:
          type: string
          example: "01"
        trace_state:
          type: string
          example: aeitron=gateway
        sampled:
          type: boolean
        method:
          type: string
          example: GET
        path:
          type: string
          example: /v1/orders
        status_code:
          type: integer
          example: 200
        start_time:
          type: string
          format: date-time
        duration_micros:
          type: integer
          example: 12500
        spans:
          type: array
          items:
            $ref: '#/components/schemas/Span'

    Span:
      type: object
      properties:
        trace_id:
          type: string
        span_id:
          type: string
        parent_span_id:
          type: string
        name:
          type: string
          example: gateway.upstream
        kind:
          type: string
          enum: [SERVER, CLIENT, INTERNAL]
        duration_micros:
          type: integer
          example: 4500
        status_code:
          type: integer
          example: 200
        attributes:
          type: object
          additionalProperties:
            type: string

    TracingStats:
      type: object
      properties:
        captured_traces:
          type: integer
          example: 1542
        max_capacity:
          type: integer
          example: 10000
        sampling_rate:
          type: number
          example: 1.0
        slow_threshold_ms:
          type: integer
          example: 50
        slow_traces_total:
          type: integer
          example: 14

  responses:
    BadRequestError:
      description: Invalid request payload or parameter format
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    NotFoundError:
      description: Requested resource was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    UnauthorizedError:
      description: Authentication failed or token missing/expired
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ForbiddenError:
      description: Insufficient permission scopes
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    RateLimitError:
      description: Rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ConflictError:
      description: Resource conflict or idempotency key payload mismatch
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    NotModifiedResponse:
      description: RFC 9111 resource has not been modified since the specified ETag (saves network bandwidth)
      headers:
        ETag:
          schema:
            type: string
            example: W/"aei_7a8b9c0d1e"
        Cache-Control:
          schema:
            type: string
            example: public, max-age=60
        Age:
          schema:
            type: string
            example: "12"
        X-Cache:
          schema:
            type: string
            example: HIT

  parameters:
    AeitronVersionHeader:
      name: Aeitron-Version
      in: header
      description: |
        Stripe-grade date-based API version requested by client (e.g. 2026-11-01).
        When omitted, defaults to the account's pinned or server-authoritative baseline version (2026-11-01).
      required: false
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
        example: '2026-11-01'

    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      description: |
        Stripe-grade unique idempotency key (8-128 characters matching [a-zA-Z0-9_-.:]) to prevent double-charges and duplicate mutations.
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
        example: ik_mutation_9a8b7c6d5e4f3a2b

    IfNoneMatchHeader:
      name: If-None-Match
      in: header
      description: |
        RFC 9111 ETag value previously received. If the entity has not changed, gateway responds with HTTP 304 Not Modified.
      required: false
      schema:
        type: string
        example: W/"aei_7a8b9c0d1e"

    AcceptEncodingHeader:
      name: Accept-Encoding
      in: header
      description: |
        Client-supported compression algorithms (e.g. gzip, deflate, br). Gateway will automatically stream-compress responses >= 512 bytes on the fly or serve pre-compressed RFC 9111 cache representations.
      required: false
      schema:
        type: string
        example: gzip, deflate, br

    LivemodeHeader:
      name: Aeitron-Livemode
      in: header
      description: |
        Stripe-grade livemode indicator. Returns 'true' when operating with production credentials,
        and 'false' when in live test sandbox mode (e.g. aeitron_test_... API keys).
      required: false
      schema:
        type: boolean
        example: false
