openapi: 3.1.0
info:
  title: Aeitron Intelligent Global Edge & Cloud Infrastructure API
  description: |
    Unified, high-performance developer API for the Aeitron Cloud Platform.
    Provides complete programmatic control over Edge Routing, Anycast DNS,
    Sovereign Databases, Compute/VPS/GPU, Web Hosting, Domain Registration,
    Server-Authoritative Pricing, Real-time Metering, and Merkle Audit Ledgers.
  version: 1.0.0
  contact:
    name: Aeitron Developer Support
    url: https://aeitron.com
    email: api-support@aeitron.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.aeitron.com
    description: Production Global Anycast Gateway
  - url: http://127.0.0.1:8000
    description: Local Unified API Gateway

security:
  - ApiKeyAuth: []
  - BearerAuth: []

paths:
  /ready:
    get:
      summary: Gateway Readiness Check
      description: Returns 200 OK when the gateway and upstream proxies are operational.
      security: []
      responses:
        '200':
          description: Gateway is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: aeitron-api-gateway
                  time:
                    type: string
                    format: date-time

  /live:
    get:
      summary: Gateway Liveness Check
      description: Returns 200 OK when the gateway process is running.
      security: []
      responses:
        '200':
          description: Process is alive

  /v1/gateway/stats:
    get:
      summary: Retrieve Real-Time Gateway Statistics
      description: Returns live telemetry, uptime, rate limited counts, and status code distributions.
      responses:
        '200':
          description: Gateway statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayStats'

  /v1/gateway/routes:
    get:
      summary: List Registered Routing Rules
      description: Returns the active reverse proxy table, timeout configurations, and upstream endpoints.
      responses:
        '200':
          description: Active route table
          content:
            application/json:
              schema:
                type: object
                properties:
                  routes:
                    type: array
                    items:
                      $ref: '#/components/schemas/RouteRule'

  /v1/auth/token:
    post:
      summary: Fast API-Key Token Exchange or JWT Issuance
      description: Authenticates credentials or exchanges an API key for a signed HMAC-SHA256 JWT access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key:
                  type: string
                  example: aeitron_live_secret_key_...
                client_id:
                  type: string
                client_secret:
                  type: string
      responses:
        '200':
          description: Token issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /v1/catalog:
    get:
      summary: List Product Catalog & Base Pricing
      description: Returns all active platform products (Compute, Domains, Hosting, Storage, Databases) with server-authoritative rates.
      security: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [domain, hosting, vps, database, storage]
      responses:
        '200':
          description: Product catalog listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'

  /v1/catalog/calculate:
    post:
      summary: Calculate Server-Authoritative Quote
      description: Computes exact monetary quote with tax and volume discounts. Client prices are never trusted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [priceId, quantity]
                    properties:
                      priceId:
                        type: string
                      quantity:
                        type: integer
                        minimum: 1
                currency:
                  type: string
                  enum: [USD, BDT]
                  default: USD
                discountCode:
                  type: string
      responses:
        '200':
          description: Calculated quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteCalculation'

  /v1/orders:
    post:
      summary: Create Order (Server-Authoritative Checkout)
      description: Places an order against server-verified prices. Triggers transactional outbox provisioning workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [priceId, quantity]
                    properties:
                      priceId:
                        type: string
                      quantity:
                        type: integer
                currency:
                  type: string
                  enum: [USD, BDT]
                idempotencyKey:
                  type: string
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /v1/orders/{order_id}:
    get:
      summary: Get Order Status and Provisioning Lifecycle
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /v1/invoices:
    get:
      summary: List Invoices & Tax Receipts
      description: Retrieves tenant invoices with Mushak 6.3 VAT compliance details.
      responses:
        '200':
          description: List of invoices

  /v1/domains/search:
    get:
      summary: Multi-TLD Domain Search & Suggestions
      description: Queries RDAP and registrar cache for multi-TLD availability and smart suggestions.
      security: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: tlds
          in: query
          schema:
            type: string
            example: com,net,org,com.bd
      responses:
        '200':
          description: Search results

  /v1/domains/check:
    get:
      summary: Authoritative Domain Availability Check
      description: Checks syntax, authoritative registrar availability, and real-time premium pricing.
      security: []
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
        - name: currency
          in: query
          schema:
            type: string
            enum: [USD, BDT]
      responses:
        '200':
          description: Domain availability result

  /v1/domains/register:
    post:
      summary: Register a Domain
      description: Purchases and registers a domain via authoritative registrar adapter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, years]
              properties:
                domain:
                  type: string
                years:
                  type: integer
                  minimum: 1
                  maximum: 10
      responses:
        '202':
          description: Domain registration initiated

  /v1/dns/zones:
    get:
      summary: List Authoritative DNS Zones
      responses:
        '200':
          description: List of DNS zones
    post:
      summary: Create DNS Zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
      responses:
        '201':
          description: Zone created

  /v1/dns/zones/{zone_id}/records:
    get:
      summary: List DNS Records in Zone
      parameters:
        - name: zone_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: DNS records
    post:
      summary: Create or Update DNS Record
      parameters:
        - name: zone_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, name, content, ttl]
              properties:
                type:
                  type: string
                  enum: [A, AAAA, CNAME, MX, TXT, NS, SRV, CAA]
                name:
                  type: string
                content:
                  type: string
                ttl:
                  type: integer
                  default: 300
      responses:
        '201':
          description: DNS record published

  /v1/hosting/accounts:
    get:
      summary: List Web Hosting Accounts
      responses:
        '200':
          description: Hosting accounts
    post:
      summary: Provision Web Hosting Account
      description: Sets up shared hosting, WordPress, or WooCommerce with cPanel/CyberPanel isolation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, plan]
              properties:
                domain:
                  type: string
                plan:
                  type: string
                  enum: [shared-starter, managed-wordpress, woocommerce-scale]
      responses:
        '201':
          description: Hosting account provisioned

  /v1/compute/instances:
    get:
      summary: List VPS and GPU Compute Instances
      responses:
        '200':
          description: List of compute instances
    post:
      summary: Provision VPS or GPU Compute Instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, plan, region, os_image]
              properties:
                name:
                  type: string
                plan:
                  type: string
                region:
                  type: string
                os_image:
                  type: string
                ssh_key:
                  type: string
      responses:
        '202':
          description: Instance provisioning queued

  /v1/compute/instances/{instance_id}/reboot:
    post:
      summary: Soft/Hard Reboot Compute Instance
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Reboot signal sent

  /v1/compute/instances/{instance_id}:
    delete:
      summary: Terminate Compute Instance
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Termination initiated

  /v1/databases/instances:
    get:
      summary: List Managed Database Instances
      responses:
        '200':
          description: List of database instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatabaseInstance'
    post:
      summary: Provision a New Sovereign Database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatabaseRequest'
      responses:
        '201':
          description: Database instance provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseInstance'

  /v1/databases/instances/{instance_id}/pitr/restore:
    post:
      summary: Point-In-Time Recovery (PITR) Restore
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_timestamp]
              properties:
                target_timestamp:
                  type: string
                  format: date-time
      responses:
        '202':
          description: PITR recovery started

  /v1/usage/events:
    post:
      summary: Ingest Real-Time Telemetry Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  items:
                    type: object
                    required: [event_id, tenant_id, metric, value]
                    properties:
                      event_id:
                        type: string
                      tenant_id:
                        type: string
                      metric:
                        type: string
                      value:
                        type: number
      responses:
        '202':
          description: Telemetry events accepted for sliding window aggregation

  /v1/usage/tenant/{tenant_id}/current:
    get:
      summary: Get Real-Time Tenant Usage Snapshot
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Real-time tenant usage snapshot

  /v1/notifications/dispatch:
    post:
      summary: Broadcast System or User Event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, type, severity, title, message]
              properties:
                tenant_id:
                  type: string
                type:
                  type: string
                severity:
                  type: string
                  enum: [info, warning, error, critical]
                title:
                  type: string
                message:
                  type: string
      responses:
        '202':
          description: Notification event accepted

  /v1/notifications/subscriptions:
    post:
      summary: Create Alert Channel Subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, channel, target]
              properties:
                tenant_id:
                  type: string
                channel:
                  type: string
                  enum: [webhook, email, sms, slack, discord, pagerduty]
                target:
                  type: string
                secret:
                  type: string
      responses:
        '201':
          description: Subscription created

  /v1/notifications/dlq:
    get:
      summary: List Dead-Letter Queue (DLQ) Records
      responses:
        '200':
          description: Dead-letter queue records

  /v1/fleet/nodes:
    get:
      summary: List Global Edge Nodes
      responses:
        '200':
          description: Edge node inventory

  /v1/fleet/canary/deploy:
    post:
      summary: Trigger Canary Deployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, initial_percentage]
              properties:
                version:
                  type: string
                initial_percentage:
                  type: integer
      responses:
        '202':
          description: Canary rollout initiated

  /v1/audit/records:
    get:
      summary: Query Merkle Cryptographic Audit Ledger
      responses:
        '200':
          description: Audit ledger records

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Scoped API Key (e.g. aeitron_live_... or aeitron_test_...)
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
        tenant_id:
          type: string
        tier:
          type: string

    GatewayStats:
      type: object
      properties:
        total_requests:
          type: integer
        active_connections:
          type: integer
        rate_limited_count:
          type: integer
        auth_failed_count:
          type: integer
        uptime_seconds:
          type: integer

    RouteRule:
      type: object
      properties:
        path_prefix:
          type: string
        upstream_url:
          type: string
        rewrite_prefix:
          type: string
        allow_anonymous:
          type: boolean
        timeout:
          type: integer

    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        prices:
          type: array
          items:
            type: object

    QuoteCalculation:
      type: object
      properties:
        subtotalMinorUnits:
          type: integer
        taxMinorUnits:
          type: integer
        totalMinorUnits:
          type: integer
        currency:
          type: string

    Order:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        status:
          type: string
        totalMinorUnits:
          type: integer
        currency:
          type: string

    DatabaseInstance:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        engine:
          type: string
        region:
          type: string
        status:
          type: string
        pitr_enabled:
          type: boolean

    CreateDatabaseRequest:
      type: object
      required: [name, engine, region]
      properties:
        name:
          type: string
        engine:
          type: string
          enum: [postgresql-16, timescaledb]
        region:
          type: string
        storage_gb:
          type: integer
          default: 20

    ProblemDetails:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        code:
          type: string
        error:
          type: string

  responses:
    UnauthorizedError:
      description: Authentication failed or token missing/expired
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ForbiddenError:
      description: Insufficient permission scopes
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    RateLimitError:
      description: Rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
