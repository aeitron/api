name: Aeitron API CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Check Formatting
        run: test -z $(gofmt -l .)

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v -race ./...
